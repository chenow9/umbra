name: Docker images

on:
  push:
    tags:
      - "v*"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  id-token: write
  attestations: write

env:
  GATE_IMAGE: chenow9/umbrad
  NODE_IMAGE: chenow9/umbra-node

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gate metadata
        id: meta-gate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GATE_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: Node metadata
        id: meta-node
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NODE_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: Build and push umbrad
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: umbrad
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-gate.outputs.tags }}
          labels: ${{ steps.meta-gate.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=umbra
          cache-to: type=gha,mode=max,scope=umbra

      - name: Build and push umbra-node
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: umbra-node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-node.outputs.tags }}
          labels: ${{ steps.meta-node.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=umbra
          cache-to: type=gha,mode=max,scope=umbra

# 公网入口。必须跑在 Linux 宿主机上（host 网络才能动态绑业务口）。
# macOS / Windows 的 Docker 没有真正的 host 网络，不能当公网入口。
#
# -listen :4400  节点 TLS 控制通道（对公网）
# -http   127.0.0.1:8080  控制台 + API。默认只绑回环。
# -tls-dir /var/lib/umbra  证书、control.json（口令、登录会话、节点凭证、映射）
# 必须把整个 tls-dir 做成 volume。只挂 ca.crt / gate.crt 会在重建容器后变成「第一次设定口令」。
#
# 预发布 tag 不打 latest。当前 Hub 上的版本例如：
#   UMBRA_TAG=0.0.1-beta docker compose -f deploy/compose.gate.yml up -d
services:
  umbrad:
    image: chenow9/umbrad:${UMBRA_TAG:-latest}
    container_name: umbrad
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    command:
      - -listen
      - :4400
      - -advertise
      - gate.example.com:4400
      - -http
      - 127.0.0.1:8080
      - -bind
      - 0.0.0.0
      - -tls-dir
      - /var/lib/umbra
    volumes:
      - umbra-tls:/var/lib/umbra
    restart: unless-stopped

volumes:
  umbra-tls:

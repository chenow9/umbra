# 公网入口。必须跑在 Linux 宿主机上（host 网络才能动态绑业务口）。
# macOS / Windows 的 Docker 没有真正的 host 网络，不能当公网入口。
#
# -listen :4400  节点 TLS 控制通道（对公网）
# -http   127.0.0.1:8080  控制台 + API。默认只绑回环。
# -tls-dir /var/lib/umbra  证书、control.json（口令、登录会话、节点凭证、映射）、traffic（速率曲线）
# 必须把整个 tls-dir 做成 volume。只挂 ca.crt / gate.crt 会在重建容器后变成「第一次设定口令」。
#
# 生产环境建议固定正式版本：
#   UMBRA_TAG=0.1.3 docker compose -f deploy/compose.gate.yml up -d
services:
  umbrad:
    image: chenow9/umbrad:${UMBRA_TAG:-latest}
    container_name: umbrad
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    # 容量与 UDP 新 flow 准入。可在 shell 或 Compose 的 .env 文件中覆盖。
    # UDP 的 0 表示关闭对应限制；UMBRA_MAX_SPLICES 必须是大于 0 的整数。
    environment:
      UMBRA_MAX_SPLICES: ${UMBRA_MAX_SPLICES:-8192}
      UMBRA_UDP_MAX_FLOWS_PER_IP: ${UMBRA_UDP_MAX_FLOWS_PER_IP:-256}
      UMBRA_UDP_NEW_FLOWS_PER_SEC: ${UMBRA_UDP_NEW_FLOWS_PER_SEC:-256}
      UMBRA_UDP_NEW_FLOWS_PER_MAP: ${UMBRA_UDP_NEW_FLOWS_PER_MAP:-1024}
      UMBRA_UDP_READ_BUFFER: ${UMBRA_UDP_READ_BUFFER:-524288}
    command:
      - -listen
      - :4400
      - -advertise
      - gate.example.com:4400
      - -http
      - 127.0.0.1:8080
      - -bind
      - 0.0.0.0
      - -tls-dir
      - /var/lib/umbra
    volumes:
      - umbra-tls:/var/lib/umbra
    restart: unless-stopped

volumes:
  umbra-tls:
